name: Bug report
description: Report incorrect behavior in rules, skills, templates, or automation.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please avoid sharing secrets, private repository URLs, or customer data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Steps, command, or prompt that reproduces the issue.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, shell, AI tool, and TIC version if known.
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Redacted logs, validation output, or screenshots.
